[project]
name = "server"
version = "0.1.0"
description = "Pyrags backend — document ingestion, pgvector retrieval, and conversational RAG API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "inngest>=0.5.19",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "pgvector>=0.5.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "sqlmodel>=0.0.47",
]
